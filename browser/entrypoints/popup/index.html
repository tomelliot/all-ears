<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>All Ears</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --ink: #1c1b1a;
        --paper: #f7f4ee;
        --paper-2: #efe9df;
        --card: #fffdf8;
        --fg: #1c1b1a;
        --bg: #f7f4ee;
        --line: #ded7ca;
        --muted: #7c766c;
        --accent: #e0a03c;
        --ok: #4a7c59;
        --bad: #c0503a;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f2efe8;
          --bg: #151413;
          --paper-2: #1e1c1a;
          --card: #1c1a18;
          --line: #312e2a;
          --muted: #948d81;
          --ok: #8fce9e;
          --bad: #e58a72;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 248px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
        font-size: 13px;
      }
      main {
        padding: 14px 16px 16px;
      }

      /* ── Header: brand lockup left, status badge top right ─────────────── */
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand svg {
        /* The viewBox is cropped to the mark's ink bounds so the box is the
           drawing — flex centring then aligns it honestly and the 8px gap is
           the real visual gap. At 17px tall the arc matches the wordmark's
           cap height and the lobe dot hangs just below the baseline, like a
           descender. */
        width: 10.34px;
        height: 17px;
        display: block;
        color: var(--fg);
        flex: none;
      }
      .brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.3px;
        line-height: 1;
      }
      .brand b .dot {
        color: var(--accent);
      }

      /* ── Status badge (shadcn badge, brand-tuned) ──────────────────────────
         Collapsed: a 20px circle showing only the status dot. On hover the
         pill expands leftward (right edge is flex-anchored) revealing the
         label to the left of the dot. */
      .badge {
        display: inline-flex;
        align-items: center;
        margin-left: auto;
        flex: none;
        height: 20px;
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        overflow: hidden;
        cursor: default;
      }
      .badge-text {
        max-width: 0;
        margin-right: 0;
        opacity: 0;
        white-space: nowrap;
        overflow: hidden;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        transition:
          max-width 0.28s ease,
          margin-right 0.28s ease,
          opacity 0.2s ease;
      }
      .badge:hover .badge-text {
        max-width: 150px;
        margin-right: 6px;
        opacity: 1;
      }
      .badge-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        flex: none;
        transition: background 0.2s ease;
      }
      .badge[data-status="connected"] .badge-dot {
        background: var(--ok);
      }
      .badge[data-status="connecting"] .badge-dot {
        background: var(--accent);
      }
      .badge[data-status="disconnected"] .badge-dot {
        background: var(--bad);
      }
      /* Session states: recording pulses red (classic record light), paused
         holds steady amber, transcribing pulses green before settling back
         to the steady connected green. */
      .badge[data-status="recording"] .badge-dot {
        background: var(--bad);
        animation: dot-pulse 1.6s ease-in-out infinite;
      }
      .badge[data-status="paused"] .badge-dot {
        background: var(--accent);
      }
      .badge[data-status="transcribing"] .badge-dot {
        background: var(--ok);
        animation: dot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes dot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      /* ── Capture row with switch (shadcn switch, brand-tuned) ──────────── */
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 2px 0;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
      }
      .row:has(input:disabled) {
        cursor: default;
      }
      .switch {
        position: relative;
        display: inline-flex;
        flex: none;
      }
      .switch input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: inherit;
      }
      .switch-track {
        display: inline-flex;
        align-items: center;
        width: 34px;
        height: 20px;
        border-radius: 999px;
        background: var(--line);
        transition: background 0.2s ease;
        pointer-events: none;
      }
      .switch-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--card);
        box-shadow: 0 1px 2px rgba(28, 27, 26, 0.25);
        transform: translateX(2px);
        transition: transform 0.2s ease;
      }
      .switch input:checked + .switch-track {
        background: var(--accent);
      }
      .switch input:checked + .switch-track .switch-thumb {
        transform: translateX(16px);
      }
      .switch input:focus-visible + .switch-track {
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent);
      }
      .switch input:disabled + .switch-track {
        opacity: 0.5;
      }
      /* ── Debug: report-state button ────────────────────────────────────── */
      .debug-btn {
        margin-top: 12px;
        width: 100%;
        padding: 7px 10px;
        font: inherit;
        font-size: 12px;
        color: var(--muted);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 7px;
        cursor: pointer;
      }
      .debug-btn:hover {
        color: var(--fg);
        border-color: var(--muted);
      }
      .debug-btn:active {
        background: var(--paper-2);
      }
      .debug-note {
        margin-top: 6px;
        min-height: 14px;
        font-size: 11px;
        color: var(--muted);
      }
      #site-list-items {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
        font-size: 12px;
      }
      #site-list-items li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 0;
      }
      #site-list-items span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .site-remove {
        font: inherit;
        font-size: 11px;
        padding: 1px 6px;
        border: 1px solid var(--line, rgba(0, 0, 0, 0.2));
        border-radius: 4px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .debug-log-row {
        margin-top: 14px;
      }
      .debug-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .debug-actions .debug-btn {
        margin-top: 0;
      }
      /* ── Perf section ──────────────────────────────────────────────────── */
      .section-rule {
        margin: 16px 0 10px;
        border: 0;
        border-top: 1px solid var(--line, rgba(0, 0, 0, 0.12));
      }
      .section-title {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .perf-warn {
        margin-top: 6px;
        min-height: 14px;
        font-size: 11px;
        color: var(--warn, #a4571b);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <svg viewBox="23 13 45 74" aria-hidden="true">
            <g transform="matrix(1 0 0 -1 0 100)">
              <path fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"
                stroke-linejoin="round" d="M62,33 C43,31 29,43 29,54 C29,68 43,79 62,81"/>
              <circle cx="61" cy="20" r="7" fill="var(--accent)"/>
            </g>
          </svg>
          <b>All<span class="dot">&#183;</span>Ears</b>
        </div>
        <div class="badge" id="status-badge" data-status="loading" aria-live="polite">
          <span class="badge-text" id="status-text">Loading&hellip;</span>
          <span class="badge-dot" id="status-dot" aria-hidden="true"></span>
        </div>
      </header>
      <label class="row">
        <span class="switch">
          <input type="checkbox" role="switch" id="toggle" disabled />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </span>
        <span id="toggle-label">Capture</span>
      </label>
      <!-- Shown only while a session is live. Pausing pauses the daemon
           session's mark over the paused span; audio capture keeps running. -->
      <label class="row" id="transcription-row" hidden>
        <span class="switch">
          <input type="checkbox" role="switch" id="transcription-toggle" disabled />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </span>
        <span id="transcription-label">Transcription</span>
      </label>
      <!-- Debug: dump MAIN-world capture/probe/hook state to each open meeting
           tab's console (filter the console by [ears][debug][state]). -->
      <button type="button" id="debug-report" class="debug-btn">Report state to console</button>
      <!-- Debug: record every WebAudio track and provenance record as one
           track-snapshot event in the live session's attribution.jsonl. -->
      <button type="button" id="debug-snapshot" class="debug-btn">Send track snapshot to earsd</button>
      <!-- Site hooks: register the capture scripts on the current site (and its
           iframe origins) when the manifest doesn't cover it. Hidden on built-in
           platforms and non-web pages. lib/site-hooks.ts. -->
      <div id="site-hooks" hidden>
        <button type="button" id="site-hooks-btn" class="debug-btn">Enable hooks on this site</button>
        <button type="button" id="site-hooks-reload" class="debug-btn" hidden>Reload tab to load hooks</button>
        <div id="site-hooks-note" class="debug-note" aria-live="polite"></div>
      </div>
      <!-- Every site enabled above, on any tab, each removable (which also
           drops its host permission). -->
      <div id="site-list" hidden>
        <div class="debug-note">Sites with hooks enabled</div>
        <ul id="site-list-items"></ul>
      </div>
      <!-- Debug logging: tee every context's console into a persisted ring
           buffer, exportable as a .jsonl file. Off by default. -->
      <label class="row debug-log-row">
        <span class="switch">
          <input type="checkbox" role="switch" id="debug-log-toggle" disabled />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </span>
        <span>Debug logging to disk</span>
      </label>
      <div class="debug-actions">
        <button type="button" id="download-log" class="debug-btn">Download log</button>
        <button type="button" id="clear-log" class="debug-btn">Clear log</button>
      </div>
      <div id="debug-report-note" class="debug-note" aria-live="polite"></div>

      <!-- Performance instrumentation. Tier 1 (long tasks, video receive
           stats, transport counters) runs by default and has no control here;
           this switch governs the part that costs something. -->
      <hr class="section-rule" />
      <div class="section-title">Performance</div>
      <label class="row debug-log-row">
        <span class="switch">
          <input type="checkbox" role="switch" id="perf-detail-toggle" disabled />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </span>
        <span>Per-frame stage timing</span>
      </label>
      <div id="perf-note" class="perf-warn" aria-live="polite"></div>
      <div class="debug-actions">
        <button type="button" id="download-perf" class="debug-btn">Download perf</button>
        <button type="button" id="clear-perf" class="debug-btn">Clear perf</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
